# Verifies the documented offline-build path on a real Windows machine with
# MSVC Build Tools and LLVM. Clones kaeru upstream rather than checking this
# branch out, so the branch carries nothing but this file.
#
# Two passes, deliberately:
#   A. core.autocrlf left at the Windows default, to show what a stock install
#      actually does.
#   B. core.autocrlf=false, to get past it and exercise the real build.
name: offline build (windows)

on:
  workflow_dispatch:
  push:
    branches: [ ci/offline-windows ]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: What the runner has
        shell: pwsh
        run: |
          rustc -vV
          cargo -V
          git --version
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") { "libclang: FOUND" } else { "libclang: MISSING" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -latest -products * -property displayName }

      # ---- Pass A: what a stock Windows install does -----------------------
      - name: A. Clone with the Windows default (core.autocrlf=true)
        shell: pwsh
        run: |
          git config --global core.autocrlf true
          git clone --quiet https://github.com/LamantinAI/kaeru.git kaeru-default
          cd kaeru-default
          git log --oneline -1

      - name: A. Line endings of the two Cargo.lock files
        shell: bash
        run: |
          echo "kaeru checkout (main repo has no .gitattributes):"
          file kaeru-default/Cargo.lock
          printf '  CR bytes: %s\n' "$(grep -c $'\r' kaeru-default/Cargo.lock || true)"
          git clone --quiet --depth 1 --branch v0.7.0 \
            https://github.com/LamantinAI/kaeru-vendor.git vendor-probe
          echo "kaeru-vendor checkout (has .gitattributes '* -text'):"
          file vendor-probe/Cargo.lock
          printf '  CR bytes: %s\n' "$(grep -c $'\r' vendor-probe/Cargo.lock || true)"
          echo "cmp, which is what fetch-vendor.sh runs:"
          cmp kaeru-default/Cargo.lock vendor-probe/Cargo.lock && echo "  identical" || echo "  DIFFER"

      - name: A. fetch-vendor.sh on that checkout (expected to fail)
        id: pass_a
        continue-on-error: true
        shell: bash
        working-directory: kaeru-default
        run: ./contrib/offline/fetch-vendor.sh

      - name: A. Verdict
        shell: pwsh
        run: 'Write-Output "pass A outcome: ${{ steps.pass_a.outcome }}"'

      # ---- Pass B: with the line-ending conversion turned off --------------
      - name: B. Clone with core.autocrlf=false
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git clone --quiet https://github.com/LamantinAI/kaeru.git kaeru
          cd kaeru
          git log --oneline -1

      - name: B. fetch-vendor.sh, from Git Bash, network on
        shell: bash
        working-directory: kaeru
        run: ./contrib/offline/fetch-vendor.sh

      - name: B. The config it produced
        shell: bash
        working-directory: kaeru
        run: cat .cargo/config.toml

      # No --offline flag: the [net] stanza in the fetched config is what has
      # to hold. Empty CARGO_HOME so anything fetched would show up.
      - name: B. Build
        shell: pwsh
        working-directory: kaeru
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $env:CARGO_HOME = "$env:RUNNER_TEMP\fresh-cargo-home"
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cargo build --release -p kaeru-mcp
          $sw.Stop()
          "BUILD TIME: $($sw.Elapsed)"

      - name: B. Nothing came from the network
        shell: pwsh
        run: |
          $ch = "$env:RUNNER_TEMP\fresh-cargo-home"
          "CARGO_HOME contents:"
          Get-ChildItem $ch -Force | ForEach-Object { "  " + $_.Name }
          $reg = Join-Path $ch 'registry'
          if (Test-Path $reg) {
            "registry entries: " + (Get-ChildItem $reg -Force -Recurse | Measure-Object).Count
          } else { "registry: absent" }
          if (Test-Path (Join-Path $ch 'git')) { "git cache: PRESENT" } else { "git cache: absent" }

      - name: B. The binary runs
        shell: pwsh
        working-directory: kaeru
        run: |
          Get-Item .\target\release\kaeru-mcp.exe | Format-List Name, Length
          $p = Start-Process -FilePath .\target\release\kaeru-mcp.exe -PassThru -NoNewWindow `
                 -RedirectStandardOutput daemon-out.log -RedirectStandardError daemon-err.log
          Start-Sleep -Seconds 8
          Stop-Process -Id $p.Id -Force
          Get-Content daemon-out.log, daemon-err.log -ErrorAction SilentlyContinue
